# Development config — points at the bundled echo server so you can exercise
# ProvMCP without any real MCP servers installed. Replace the `command` lines
# with Anthropic's reference servers once you've installed them.

[proxy]
host = "127.0.0.1"
port = 7337
policy = "warn_and_confirm"
detector_threshold = 0.6
audit_log = "../logs/audit.jsonl"          # relative to this file
approvals_file = "../logs/approvals.json"

# Per-pair overrides, e.g. never let fetched web content drive file writes:
# [[proxy.pair_policies]]
# source = "fetch"
# target = "filesystem"
# policy = "strict"

[detection]
detectors = ["substring", "structured"]   # add "embedding" with the [embed] extra
allowlist = []                            # values allowed to cross servers, e.g. your own email
# Since 0.9.0 the defaults are the Week 9 calibration (docs/results/calibration-week9.md):
#   thresholds = { substring = 0.428, structured = 0.85 }, track_tool_metadata = true
# To go back to the Week 7 behaviour (one global threshold, no tool metadata):
# thresholds = {}
# track_tool_metadata = false
# To add the embedding detector at its calibrated threshold (opt-in, not yet
# measured on real traffic):
# detectors = ["substring", "structured", "embedding"]
# thresholds = { substring = 0.428, structured = 0.85, embedding = <from calibration-week9.md> }

[[servers]]
id = "echo"
display_name = "Echo (dummy)"
trust = "trusted"
transport = "stdio"
command = ["python", "examples/dummy_server/echo_server.py"]

[[servers]]
id = "time"
display_name = "Time (reference)"
trust = "trusted"
transport = "stdio"
command = ["uvx", "mcp-server-time"]

# Uncomment to add the filesystem reference server:
#
# [[servers]]
# id = "filesystem"
# display_name = "Filesystem (reference)"
# trust = "trusted"
# transport = "stdio"
# command = ["uvx", "mcp-server-filesystem", "/Users/harshil/Documents"]
