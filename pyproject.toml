[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provmcp"
version = "0.13.0"
description = "Runtime detection of cross-server confused-deputy attacks in MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "H" }]
keywords = ["mcp", "security", "llm-agents", "provenance"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "tomli>=2.0; python_version<'3.11'",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "asgi-lifespan>=2.1",
]

[project.scripts]
provmcp = "provmcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/provmcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
